name: Bug report
description: Сообщить о воспроизводимой ошибке
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Спасибо за отчёт. Не прикладывайте реальные персональные данные, пароли, токены и медицинские заметки.
  - type: textarea
    id: summary
    attributes:
      label: Что произошло
      description: Кратко опишите проблему
      placeholder: При открытии раздела ... появляется ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
      placeholder: |
        1. Запустить start.bat
        2. Открыть ...
        3. Нажать ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое поведение
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Фактическое поведение
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Роль
      options:
        - Подопечный
        - Волонтёр
        - Координатор
        - Администратор
        - Гость
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Окружение
      description: ОС, браузер, Docker или SQLite
      placeholder: Windows 11, Chrome 142, Docker MySQL
  - type: textarea
    id: logs
    attributes:
      label: Логи и скриншоты
      description: Удалите из логов персональные данные и секреты
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Проверки
      options:
        - label: Я проверил, что проблема воспроизводится на актуальной main
          required: true
        - label: В отчёте нет реальных персональных данных и секретов
          required: true
