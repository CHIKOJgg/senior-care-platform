name: CI/CD Quality & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    name: Automated Tests & Security Audit
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_SECRET: ci_test_secret_0123456789abcdef
      APP_ENCRYPTION_KEY: ci_test_encryption_key_2026

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_sqlite, curl, json, mbstring
          coverage: none

      - name: Check PHP Syntax & Lint
        run: |
          find app public tests -type f -name "*.php" -exec php -l {} +

      - name: Run Database Migrations & Seeds
        run: |
          php database/migrate.php
          php database/seed.php

      - name: Execute Unit, Integration & Security Tests
        run: |
          php tests/run_tests.php

      - name: Execute REST API Tests
        run: |
          php -S 127.0.0.1:8000 router.php > /tmp/care-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          php tests/test_api_requests.php

      - name: Execute Frontend WCAG Tests
        run: php tests/test_frontend_wcag.php

      - name: Execute Comprehensive E2E Tests
        run: |
          php -S 127.0.0.1:8000 router.php > /tmp/care-app.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/api/health
          php tests/test_e2e_comprehensive.php

      - name: Verify Production Docker Build & Health
        run: |
          docker build -t senior-care:ci -f Dockerfile.prod .
          docker run -d --name senior-care-ci -p 8080:80 \
            -e APP_ENV=production \
            -e APP_SECRET=ci_test_secret_0123456789abcdef \
            -e APP_ENCRYPTION_KEY=ci_test_encryption_key_2026 \
            -e ADMIN_PHONE=+375290000001 \
            -e ADMIN_PASSWORD=CiTestPassword1 \
            senior-care:ci
          sleep 8
          curl -fsS http://localhost:8080/api/health
          docker rm -f senior-care-ci

  mysql-smoke:
    name: MySQL Migration & Login Smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: senior_care_test
          MYSQL_USER: senior
          MYSQL_PASSWORD: seniorpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: senior_care_test
      DB_USERNAME: senior
      DB_PASSWORD: seniorpass
      APP_ENV: local
      APP_SECRET: ci_test_secret_0123456789abcdef
      APP_ENCRYPTION_KEY: ci_test_encryption_key_2026
      SEED_DEMO: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, pdo_sqlite, curl, json, mbstring

      - name: Migrate and seed MySQL
        run: |
          php database/migrate.php
          php database/seed.php

      - name: Start app and verify health + login
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/care-app-mysql.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/health
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"phone":"+375291112233","password":"password123","remember":true}' \
            http://127.0.0.1:8080/api/auth/login | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'
