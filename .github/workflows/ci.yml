name: CI/CD Quality & Security Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-audit:
    name: Automated Tests & Security Audit
    runs-on: ubuntu-latest
    env:
      APP_ENV: local
      APP_SECRET: ci_test_secret_0123456789abcdef
      APP_ENCRYPTION_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: senior_care_test
      DB_USERNAME: senior
      DB_PASSWORD: seniorpass
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: senior_care_test
          MYSQL_USER: senior
          MYSQL_PASSWORD: seniorpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, json, mbstring
          coverage: none

      - name: Initialize Storage Directories
        run: |
          mkdir -p storage/data storage/logs storage/cache storage/metrics storage/cache/rate_limits
          chmod -R 777 storage

      - name: Check PHP Syntax & Lint
        run: |
          find app public tests database -type f -name "*.php" -exec php -l {} +
          php -l router.php

      - name: Run Database Migrations & Seeds
        run: |
          php database/migrate.php
          php database/seed.php

      - name: Execute Full Deterministic Test Matrix
        run: |
          php tests/run_all.php

      - name: Execute Crypto & Migration Stress
        run: |
          php tests/stress_m1_crypto.php

      - name: Execute Frontend Static, Zero-Emoji & Voice-Regex Audits
        run: |
          node --check public/js/app.js
          node --check public/js/speech.js
          node tests/test_plan_and_emoji.js
          node tests/test_v8_regex.js

      - name: Verify Production Docker Build & Health
        run: |
          php database/reset.php
          php database/migrate.php
          docker build -t senior-care:ci -f Dockerfile.prod .
          docker run -d --name senior-care-ci --network host \
            -e APP_ENV=production \
            -e APP_SECRET=ci_test_secret_0123456789abcdef0123456789abcdef \
            -e APP_ENCRYPTION_KEY=base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA= \
            -e ADMIN_PHONE=+375290000001 \
            -e ADMIN_PASSWORD=CiTestPassword1 \
            -e ELDERLY_AUTO_LOGIN=false \
            -e DB_CONNECTION=mysql \
            -e DB_HOST=127.0.0.1 \
            -e DB_PORT=3306 \
            -e DB_DATABASE=senior_care_test \
            -e DB_USERNAME=senior \
            -e DB_PASSWORD=seniorpass \
            senior-care:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost/api/health; then
              break
            fi
            sleep 2
          done
          curl -fsS http://localhost/api/health
          docker rm -f senior-care-ci

  mysql-smoke:
    name: MySQL Migration & Login Smoke
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: senior_care_test
          MYSQL_USER: senior
          MYSQL_PASSWORD: seniorpass
          MYSQL_ROOT_PASSWORD: rootpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: senior_care_test
      DB_USERNAME: senior
      DB_PASSWORD: seniorpass
      APP_ENV: local
      APP_SECRET: ci_test_secret_0123456789abcdef
      APP_ENCRYPTION_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      SEED_DEMO: "true"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2 with MySQL driver
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo, pdo_mysql, curl, json, mbstring

      - name: Initialize Storage Directories
        run: |
          mkdir -p storage/data storage/logs storage/cache storage/metrics storage/cache/rate_limits
          chmod -R 777 storage

      - name: Migrate and seed MySQL
        run: |
          php database/migrate.php
          php database/seed.php

      - name: Start app and verify health + login
        run: |
          php -S 127.0.0.1:8080 router.php > /tmp/care-app-mysql.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/health > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          if ! curl -fsS http://127.0.0.1:8080/api/health; then
            echo "=== Health check failed. Server log: ==="
            cat /tmp/care-app-mysql.log || true
            exit 1
          fi
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d '{"phone":"+375291112233","password":"password123","remember":true}' \
            http://127.0.0.1:8080/api/auth/login | grep -Eq '"success"[[:space:]]*:[[:space:]]*true'
