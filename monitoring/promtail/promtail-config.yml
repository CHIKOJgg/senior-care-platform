server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/senior_care_.*'
        action: keep
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: stream

  - job_name: care-app-files
    static_configs:
      - targets: ['localhost']
        labels:
          job: care-app
          __path__: /var/log/care/*.log
    pipeline_stages:
      - regex:
          expression: '^\[(?P<timestamp>[^\]]+)\] \[(?P<level>[A-Z]+)\]'
      - labels:
          level:

  - job_name: nginx-files
    static_configs:
      - targets: ['localhost']
        labels:
          job: care-nginx
          __path__: /var/log/nginx/*.log
