services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - senior-care
    container_name: senior_care_platform
    command: >
      sh -c "php database/migrate.php &&
             php database/seed.php &&
             php -S 0.0.0.0:8000 router.php"
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=senior_care
      - DB_USERNAME=senior
      - DB_PASSWORD=seniorpass
      - APP_ENV=local
      - APP_DEBUG=true
      # Local demo only: enables X-Demo-User and the explicit "continue without
      # password" senior button. Never enable together with a public deployment.
      - ALLOW_DEMO_AUTH=true
      # Kiosk mode only. With false, "/" shows a neutral guest screen and the
      # senior chooses the passwordless demo login explicitly.
      - ELDERLY_AUTO_LOGIN=false
      - ELDERLY_DEMO_PHONE=+375291112233
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: senior_care_dev_mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=senior_care
      - MYSQL_USER=senior
      - MYSQL_PASSWORD=seniorpass
      - MYSQL_ROOT_PASSWORD=rootpass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "3307:3306"
    volumes:
      - senior_care_dev_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

volumes:
  senior_care_dev_mysql:
