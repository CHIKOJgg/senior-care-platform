services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - senior-care
    container_name: senior_care_platform
    command: ["php", "-S", "0.0.0.0:8000", "router.php"]
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - .:/var/www/html
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${MYSQL_DATABASE:-senior_care}
      - DB_USERNAME=${MYSQL_USER:-senior}
      - DB_PASSWORD=${MYSQL_PASSWORD:-senior_dev_password}
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: senior_care_mysql_dev
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE:-senior_care}
      - MYSQL_USER=${MYSQL_USER:-senior}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-senior_dev_password}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_dev_password}
    volumes:
      - senior_care_mysql_dev:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  senior_care_mysql_dev:
