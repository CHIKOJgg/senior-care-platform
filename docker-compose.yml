
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      tags:
        - senior-care
    container_name: senior_care_platform
    command: php -S 0.0.0.0:8000 router.php
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www/html
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=database/database.sqlite
      - APP_ENV=local
      - APP_DEBUG=true
