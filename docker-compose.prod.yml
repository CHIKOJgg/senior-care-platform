services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    container_name: senior_care_prod
    restart: always
    ports:
      - "80:80"
    environment:
      - APP_ENV=production
      - APP_DEBUG=false
      - APP_SECRET=${APP_SECRET:?APP_SECRET must be set (openssl rand -hex 32)}
      - ADMIN_PHONE=${ADMIN_PHONE:?ADMIN_PHONE must be set}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      - SEED_DEMO=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=storage/data/database.sqlite
    volumes:
      - senior_care_data:/var/www/html/storage/data
      - senior_care_logs:/var/www/html/storage/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

volumes:
  senior_care_data:
    driver: local
  senior_care_logs:
    driver: local
